name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    name: Build e testes (unitários + Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # O runner Ubuntu já traz Docker, que o Testcontainers usa para subir o PostgreSQL 16
      - name: Testes
        run: |
          chmod +x mvnw
          ./mvnw -B clean test

      - name: Relatórios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-surefire
          path: target/surefire-reports/
          retention-days: 7

  imagem:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs: testes
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t compras-cotacoes:ci .
