# English messages
# Messages with arguments go through MessageFormat: single quotes must be written as ''

# --- Generic errors ---
erro.validacao=The request contains invalid fields
erro.requisicao.invalida=The request body is malformed or contains invalid values
erro.parametro.invalido=Parameter ''{0}'' received an invalid value: {1}
erro.conflito.integridade=The operation violates a uniqueness or data integrity constraint
erro.interno=An unexpected error occurred. Please try again shortly

# --- Field validation (Bean Validation) ---
validacao.obrigatorio=is required
validacao.tamanho.maximo=must have at most {max} characters
validacao.positivo=must be greater than zero
validacao.nao.negativo=must not be negative
validacao.email=must be a valid e-mail address
validacao.documento=must be a CPF (11 digits) or CNPJ (14 digits), with or without punctuation
validacao.percentual=must be between 0 and 100

# --- Products and stock ---
produto.nao.encontrado=Product {0,number,#} not found
produto.sku.duplicado=A product with SKU ''{0}'' already exists
produto.inativo=Product ''{0}'' is inactive
estoque.saldo.insuficiente=Insufficient stock for this withdrawal: current balance {0}, requested quantity {1}
estoque.quantidade.positiva=Quantity must be greater than zero for {0} movements
cotacao.observacao.reposicao=Automatic replenishment: balance {0} reached the minimum stock {1} of product {2}

# --- Suppliers ---
fornecedor.nao.encontrado=Supplier {0,number,#} not found
fornecedor.documento.duplicado=A supplier with document ''{0}'' already exists
fornecedor.inativo=Supplier ''{0}'' is inactive

# --- Quotations ---
cotacao.nao.encontrada=Quotation {0,number,#} not found
cotacao.status.inicial.invalido=A quotation can only be created as RASCUNHO (draft) or ABERTA (open) (received: {0})
cotacao.em.andamento=Quotation {0} is already in progress (status {1}) for this product
cotacao.status.invalido.abrir=Only draft quotations can be opened; quotation {0} is {1}
cotacao.data.limite.passada=The quotation deadline cannot be in the past
cotacao.nao.aberta=Quotation {0} is not OPEN (current status: {1})
cotacao.prazo.encerrado=The proposal deadline for quotation {0} ended on {1}
cotacao.fornecedor.nao.convidado=Supplier ''{0}'' was not invited to quotation {1}

# --- Proposals and decision ---
proposta.duplicada=Supplier ''{0}'' has already submitted a proposal for quotation {1}
proposta.validade.passada=The proposal expiration date cannot be in the past
proposta.minimo.nao.atingido=At least {0} valid proposals are required to decide; quotation {1} has {2}
proposta.nao.pertence=Proposal {0,number,#} does not belong to quotation {1}
proposta.nao.elegivel.status=Proposal {0,number,#} is not PENDING (current status: {1})
proposta.nao.elegivel.fornecedor.inativo=Proposal {0,number,#} is not eligible: supplier ''{1}'' is inactive
proposta.nao.elegivel.vencida=Proposal {0,number,#} is not eligible: it expired on {1}
proposta.justificativa.obrigatoria=The chosen proposal ({0,number,#}) differs from the one recommended by the {1} criterion (proposal {2,number,#}); a justification is required
proposta.justificativa.automatica=Automatically selected by the {0} criterion

# --- Purchase orders ---
pedido.nao.encontrado=Purchase order {0,number,#} not found
pedido.status.invalido.receber=Only ISSUED purchase orders can be received; order {0} is {1}

# --- Security and limits (added after the vulnerability assessment) ---
erro.metodo.nao.suportado=HTTP method {0} is not supported on this route
erro.midia.nao.suportada=Unsupported content type: {0}. Send application/json
erro.midia.nao.aceitavel=This route only produces application/json
erro.corpo.muito.grande=The request body exceeds the {0} KB limit
validacao.digitos=must have at most {integer} integer digits and {fraction} decimal places
validacao.maximo=must be at most {value}
proposta.valor.excede.limite=The calculated proposal total exceeds the supported limit
