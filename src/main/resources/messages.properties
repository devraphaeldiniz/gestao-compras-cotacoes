# Idioma padrão: português (Brasil)
# Mensagens com argumentos passam pelo MessageFormat: aspas simples devem ser escritas como ''

# --- Erros genéricos ---
erro.validacao=Há campos inválidos na requisição
erro.requisicao.invalida=O corpo da requisição está mal formatado ou contém valores inválidos
erro.parametro.invalido=O parâmetro ''{0}'' recebeu um valor inválido: {1}
