validacao.documento=deve ser um CPF (11 dígitos) ou CNPJ (14 dígitos), com ou sem pontuação
validacao.percentual=deve estar entre 0 e 100

# --- Produtos e estoque ---
produto.nao.encontrado=Produto {0,number,#} não encontrado
