<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compras & Cotações</title>
<style>
  :root {
    --bg: #0e1116; --surface: #161b22; --surface-2: #1c232d; --line: #2a3340;
    --text: #e6edf3; --muted: #8b98a8; --accent: #4f8cff; --accent-2: #2f6fe0;
    --ok: #3fb950; --warn: #d29922; --bad: #f85149;
    --radius: 10px; --mono: ui-monospace, SFMono-Regular, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 10; background: rgba(14,17,22,.92); backdrop-filter: blur(8px);
           border-bottom: 1px solid var(--line); }
  .bar { max-width: 1240px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 20px; }
  .brand { font-weight: 700; font-size: 16px; white-space: nowrap; }
  .brand span { color: var(--accent); }
  nav { display: flex; gap: 4px; flex: 1; flex-wrap: wrap; }
  nav button { background: none; border: 0; color: var(--muted); padding: 7px 12px; border-radius: 8px; cursor: pointer; font: inherit; }
  nav button:hover { color: var(--text); background: var(--surface-2); }
  nav button.ativo { color: var(--text); background: var(--surface-2); box-shadow: inset 0 -2px 0 var(--accent); }
  .idioma { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .idioma button { background: none; border: 0; color: var(--muted); padding: 6px 10px; cursor: pointer; font: 600 12px/1 inherit; }
  .idioma button.ativo { background: var(--accent); color: #fff; }
  .bar a { color: var(--muted); text-decoration: none; font-size: 13px; white-space: nowrap; }
  .bar a:hover { color: var(--text); }

  main { max-width: 1240px; margin: 0 auto; padding: 24px 20px 60px; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .kpi small { color: var(--muted); display: block; font-size: 12px; }
  .kpi strong { font-size: 24px; font-variant-numeric: tabular-nums; }
  h2 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 16px; }
  .grade { display: grid; grid-template-columns: 340px 1fr; gap: 16px; align-items: start; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; overflow-x: auto; }
  .card h3 { font-size: 14px; margin: 0 0 12px; }
  form { display: grid; gap: 10px; }
  .linha { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  input, select, textarea { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
                            padding: 8px 10px; font: inherit; width: 100%; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  button.primario, button.secundario { border: 0; border-radius: 8px; padding: 9px 14px; font: 600 13px/1 inherit; cursor: pointer; }
  button.primario { background: var(--accent); color: #fff; }
  button.primario:hover { background: var(--accent-2); }
  button.secundario { background: var(--surface-2); color: var(--text); border: 1px solid var(--line); }
  button.secundario:hover { border-color: var(--muted); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .filtros { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .filtros select { width: auto; }
  .filtros label { display: flex; align-items: center; gap: 6px; font-size: 13px; }
  .filtros input[type=checkbox] { width: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tbody tr:hover { background: var(--surface-2); }
  tr.clicavel { cursor: pointer; }
  .mono { font-family: var(--mono); font-size: 12.5px; }
  .vazio { color: var(--muted); text-align: center; padding: 28px; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; border: 1px solid; white-space: nowrap; }
  .t-RASCUNHO, .t-PENDENTE, .t-EMITIDO { color: var(--warn); border-color: rgba(210,153,34,.4); background: rgba(210,153,34,.08); }
  .t-ABERTA { color: var(--accent); border-color: rgba(79,140,255,.4); background: rgba(79,140,255,.08); }
  .t-FECHADA, .t-VENCEDORA, .t-RECEBIDO, .t-ok { color: var(--ok); border-color: rgba(63,185,80,.4); background: rgba(63,185,80,.08); }
  .t-CANCELADA, .t-REJEITADA, .t-CANCELADO, .t-off { color: var(--muted); border-color: var(--line); }
  .t-DESQUALIFICADA, .t-alerta { color: var(--bad); border-color: rgba(248,81,73,.4); background: rgba(248,81,73,.08); }
  .acoes { display: flex; gap: 6px; justify-content: flex-end; }
  .acoes button { padding: 6px 10px; font-size: 12px; }

  /* Detalhe da cotação */
  .detalhe { margin-top: 16px; }
  .cab { display: flex; justify-content: space-between; align-items: start; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
  .cab h3 { font-size: 16px; margin: 0; }
  .meta { display: flex; gap: 18px; flex-wrap: wrap; color: var(--muted); font-size: 13px; margin-top: 6px; }
  .meta b { color: var(--text); font-weight: 600; }
  .recs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 10px 0 14px; }
  .rec { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; background: var(--surface-2); }
  .rec h4 { margin: 0 0 8px; font-size: 13px; }
  .rec ol { margin: 0; padding-left: 20px; }
  .rec li { padding: 2px 0; }
  .rec li span { color: var(--muted); font-size: 12px; }
  .paineis { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; margin-top: 14px; }
  .paineis .card { background: var(--surface-2); }
  .aviso { border-left: 3px solid var(--warn); background: rgba(210,153,34,.08); padding: 8px 12px; border-radius: 6px; font-size: 13px; margin: 0 0 10px; }
  .checks { display: grid; gap: 4px; max-height: 150px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  .checks label { display: flex; gap: 8px; align-items: center; color: var(--text); font-size: 13px; }
  .checks input { width: auto; }

  #toast { position: fixed; right: 20px; bottom: 20px; display: grid; gap: 8px; z-index: 50; max-width: 420px; }
  .msg { background: var(--surface-2); border: 1px solid var(--line); border-left: 4px solid var(--ok); border-radius: 8px;
         padding: 10px 14px; box-shadow: 0 8px 24px rgba(0,0,0,.4); animation: entra .2s ease-out; }
  .msg.erro { border-left-color: var(--bad); }
  .msg ul { margin: 6px 0 0; padding-left: 18px; color: var(--muted); font-size: 12.5px; }
  @keyframes entra { from { transform: translateY(8px); opacity: 0; } }
  [hidden] { display: none !important; }
  td.mono { white-space: nowrap; }
  @media (max-width: 1100px) {
    .grade { grid-template-columns: 1fr; }
  }
  @media (max-width: 960px) {
    .recs { grid-template-columns: 1fr; }
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .bar { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">Compras <span>&amp;</span> Cotações</div>
    <nav id="abas">
      <button data-aba="produtos" data-i18n="aba.produtos"></button>
      <button data-aba="fornecedores" data-i18n="aba.fornecedores"></button>
      <button data-aba="cotacoes" data-i18n="aba.cotacoes"></button>
      <button data-aba="pedidos" data-i18n="aba.pedidos"></button>
    </nav>
    <a href="/swagger-ui.html" target="_blank" rel="noopener">Swagger ↗</a>
    <div class="idioma" role="group" aria-label="Idioma / Language">
      <button data-lang="pt">PT</button>
      <button data-lang="en">EN</button>
    </div>
  </div>
</header>

<main>
  <section class="kpis">
    <div class="kpi"><small data-i18n="kpi.necessidade"></small><strong id="kpi-necessidade">–</strong></div>
    <div class="kpi"><small data-i18n="kpi.rascunhos"></small><strong id="kpi-rascunhos">–</strong></div>
    <div class="kpi"><small data-i18n="kpi.abertas"></small><strong id="kpi-abertas">–</strong></div>
    <div class="kpi"><small data-i18n="kpi.emitidos"></small><strong id="kpi-emitidos">–</strong></div>
  </section>

  <!-- PRODUTOS -->
  <section data-view="produtos">
    <h2 data-i18n="produtos.titulo"></h2>
    <p class="sub" data-i18n="produtos.sub"></p>
    <div class="grade">
      <div class="card">
        <h3 data-i18n="produtos.novo"></h3>
        <form id="form-produto">
          <label><span data-i18n="campo.sku"></span><input name="sku" required maxlength="50" placeholder="CAN-AZ-50"></label>
          <label><span data-i18n="campo.nome"></span><input name="nome" required maxlength="150"></label>
          <div class="linha">
            <label><span data-i18n="campo.unidade"></span>
              <select name="unidade"><option>UN</option><option>CX</option><option>KG</option><option>PC</option><option>LT</option><option>MT</option></select>
            </label>
            <label><span data-i18n="campo.saldo"></span><input name="saldoAtual" type="number" step="0.0001" min="0" required></label>
          </div>
          <label><span data-i18n="campo.minimo"></span><input name="estoqueMinimo" type="number" step="0.0001" min="0" required></label>
          <button class="primario" data-i18n="acao.cadastrar"></button>
        </form>
        <h3 style="margin-top:20px" data-i18n="produtos.movimentar"></h3>
        <form id="form-estoque">
          <label><span data-i18n="campo.produto"></span><select name="produtoId" id="sel-produto-estoque" required></select></label>
          <div class="linha">
            <label><span data-i18n="campo.tipo"></span>
              <select name="tipo"><option value="SAIDA" data-i18n="mov.SAIDA"></option><option value="ENTRADA" data-i18n="mov.ENTRADA"></option><option value="AJUSTE" data-i18n="mov.AJUSTE"></option></select>
            </label>
            <label><span data-i18n="campo.quantidade"></span><input name="quantidade" type="number" step="0.0001" min="0" required></label>
          </div>
          <button class="primario" data-i18n="acao.movimentar"></button>
        </form>
      </div>
      <div class="card">
        <div class="filtros"><label><input type="checkbox" id="filtro-necessidade"> <span data-i18n="produtos.filtro"></span></label></div>
        <table>
          <thead><tr>
            <th data-i18n="campo.sku"></th><th data-i18n="campo.nome"></th><th data-i18n="campo.unidade"></th>
            <th class="num" data-i18n="campo.saldo"></th><th class="num" data-i18n="campo.minimo"></th>
            <th class="num" data-i18n="campo.ultimoPreco"></th><th class="num" data-i18n="campo.precoMedio"></th><th></th>
          </tr></thead>
          <tbody id="tb-produtos"></tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- FORNECEDORES -->
  <section data-view="fornecedores" hidden>
    <h2 data-i18n="fornecedores.titulo"></h2>
    <p class="sub" data-i18n="fornecedores.sub"></p>
    <div class="grade">
      <div class="card">
        <h3 data-i18n="fornecedores.novo"></h3>
        <form id="form-fornecedor">
          <label><span data-i18n="campo.razaoSocial"></span><input name="razaoSocial" required maxlength="180"></label>
          <label><span data-i18n="campo.documento"></span><input name="documento" required placeholder="11.222.333/0001-81"></label>
          <label><span data-i18n="campo.email"></span><input name="email" type="email" required></label>
          <label><span data-i18n="campo.prazoMedio"></span><input name="prazoMedioDias" type="number" min="0" required></label>
          <button class="primario" data-i18n="acao.cadastrar"></button>
        </form>
      </div>
      <div class="card">
        <div class="filtros">
          <select id="filtro-fornecedor">
            <option value="" data-i18n="filtro.todos"></option>
            <option value="true" data-i18n="filtro.ativos"></option>
            <option value="false" data-i18n="filtro.inativos"></option>
          </select>
        </div>
        <table>
          <thead><tr>
            <th data-i18n="campo.razaoSocial"></th><th data-i18n="campo.documento"></th><th data-i18n="campo.email"></th>
            <th class="num" data-i18n="campo.prazoMedio"></th><th data-i18n="campo.status"></th><th></th>
          </tr></thead>
          <tbody id="tb-fornecedores"></tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- COTAÇÕES -->
  <section data-view="cotacoes" hidden>
    <h2 data-i18n="cotacoes.titulo"></h2>
    <p class="sub" data-i18n="cotacoes.sub"></p>
    <div class="card">
      <div class="filtros">
        <select id="filtro-cotacao">
          <option value="" data-i18n="filtro.todas"></option>
          <option value="RASCUNHO" data-i18n="status.RASCUNHO"></option>
          <option value="ABERTA" data-i18n="status.ABERTA"></option>
          <option value="FECHADA" data-i18n="status.FECHADA"></option>
          <option value="CANCELADA" data-i18n="status.CANCELADA"></option>
        </select>
      </div>
      <table>
        <thead><tr>
          <th data-i18n="campo.codigo"></th><th data-i18n="campo.produto"></th><th class="num" data-i18n="campo.quantidade"></th>
          <th data-i18n="campo.status"></th><th class="num" data-i18n="campo.propostas"></th><th data-i18n="campo.dataLimite"></th>
        </tr></thead>
        <tbody id="tb-cotacoes"></tbody>
      </table>
    </div>
    <div class="card detalhe" id="detalhe" hidden></div>
  </section>

  <!-- PEDIDOS -->
  <section data-view="pedidos" hidden>
    <h2 data-i18n="pedidos.titulo"></h2>
    <p class="sub" data-i18n="pedidos.sub"></p>
    <div class="card">
      <table>
        <thead><tr>
          <th data-i18n="campo.numero"></th><th data-i18n="campo.cotacao"></th><th data-i18n="campo.fornecedor"></th>
          <th data-i18n="campo.produto"></th><th class="num" data-i18n="campo.quantidade"></th><th class="num" data-i18n="campo.total"></th>
          <th class="num" data-i18n="campo.prazo"></th><th data-i18n="campo.status"></th><th></th>
        </tr></thead>
        <tbody id="tb-pedidos"></tbody>
      </table>
    </div>
  </section>
</main>

<div id="toast" aria-live="polite"></div>

const idiomaInicial = () => {
  const salvo = localStorage.getItem('lang');
  if (salvo === 'pt' || salvo === 'en') return salvo;
  return (navigator.language || 'pt').toLowerCase().startsWith('en') ? 'en' : 'pt';
};
const estado = { lang: idiomaInicial(), aba: location.hash.replace('#', '') || 'produtos', cotacaoAberta: null };

const $ = (s, el = document) => el.querySelector(s);
const t = (k, vars = {}) => (I18N[estado.lang][k] ?? k).replace(/\{(\w+)\}/g, (_, v) => vars[v] ?? '');
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const locale = () => estado.lang === 'en' ? 'en-US' : 'pt-BR';
const moeda = v => v == null ? '–' : new Intl.NumberFormat(locale(), { style: 'currency', currency: 'BRL' }).format(v);
const num = (v, max = 4) => v == null ? '–' : new Intl.NumberFormat(locale(), { maximumFractionDigits: max }).format(v);
const data = v => v ? new Intl.DateTimeFormat(locale()).format(new Date(v.length === 10 ? v + 'T00:00:00' : v)) : '–';
const tag = (status, texto) => `<span class="tag t-${esc(status)}">${esc(texto ?? t('status.' + status))}</span>`;
const hojeISO = (dias = 0) => { const d = new Date(); d.setDate(d.getDate() + dias); return d.toLocaleDateString('sv-SE'); };

/** Toda chamada envia o idioma escolhido: as mensagens de erro já voltam traduzidas pelo backend. */
async function api(metodo, caminho, corpo) {
  let resposta;
  try {
    resposta = await fetch(caminho, {
      method: metodo,
      headers: { 'Content-Type': 'application/json', 'Accept-Language': estado.lang === 'en' ? 'en' : 'pt-BR' },
      body: corpo === undefined ? undefined : JSON.stringify(corpo)
    });
  } catch (e) { throw { mensagem: t('erro.rede') }; }
  const texto = await resposta.text();
  const json = texto ? JSON.parse(texto) : null;
  if (!resposta.ok) throw json || { mensagem: resposta.statusText };
  return json;
}

function avisar(texto, erro = false, campos = []) {
  const el = document.createElement('div');
  el.className = 'msg' + (erro ? ' erro' : '');
  el.innerHTML = esc(texto) + (campos.length ? '<ul>' + campos.map(c => `<li><b>${esc(c.campo)}</b>: ${esc(c.mensagem)}</li>`).join('') + '</ul>' : '');
  $('#toast').append(el);
  setTimeout(() => el.remove(), erro ? 7000 : 4000);
}
const falhou = e => avisar(e.mensagem || String(e), true, e.campos || []);

function dadosDoForm(form) {
  const obj = {};
  for (const [k, v] of new FormData(form).entries()) obj[k] = v === '' ? null : v;
  return obj;
}

/* ---------------- i18n e navegação ---------------- */
function aplicarIdioma() {
  document.documentElement.lang = estado.lang === 'en' ? 'en' : 'pt-BR';
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-lang]').forEach(b => b.classList.toggle('ativo', b.dataset.lang === estado.lang));
}
function mostrarAba(aba) {
  estado.aba = aba;
  history.replaceState(null, '', '#' + aba);
  document.querySelectorAll('[data-view]').forEach(s => s.hidden = s.dataset.view !== aba);
  document.querySelectorAll('[data-aba]').forEach(b => b.classList.toggle('ativo', b.dataset.aba === aba));
  recarregar();
}
const carregadores = () => ({ produtos: carregarProdutos, fornecedores: carregarFornecedores, cotacoes: carregarCotacoes, pedidos: carregarPedidos });
async function recarregar() {
  try {
    await Promise.all([carregarKpis(), carregadores()[estado.aba]()]);
    if (estado.aba === 'cotacoes' && estado.cotacaoAberta) await abrirDetalhe(estado.cotacaoAberta);
  } catch (e) { falhou(e); }
}

async function carregarKpis() {
  const [necessidade, cotacoes, pedidos] = await Promise.all([
    api('GET', '/api/produtos?apenasNecessidadeCompra=true'), api('GET', '/api/cotacoes'), api('GET', '/api/pedidos-compra?status=EMITIDO')]);
  $('#kpi-necessidade').textContent = necessidade.length;
  $('#kpi-rascunhos').textContent = cotacoes.filter(c => c.status === 'RASCUNHO').length;
  $('#kpi-abertas').textContent = cotacoes.filter(c => c.status === 'ABERTA').length;
  $('#kpi-emitidos').textContent = pedidos.length;
}

async function carregarProdutos() {
  const apenas = $('#filtro-necessidade').checked;
  const todos = await api('GET', '/api/produtos');
  const lista = apenas ? todos.filter(p => p.necessitaCompra) : todos;
  $('#tb-produtos').innerHTML = lista.length ? lista.map(p => `<tr>
      <td class="mono">${esc(p.sku)}</td><td>${esc(p.nome)}</td><td>${esc(p.unidade)}</td>
      <td class="num">${num(p.saldoAtual)}</td><td class="num">${num(p.estoqueMinimo)}</td>
      <td class="num">${moeda(p.ultimoPrecoCompra)}</td><td class="num">${moeda(p.precoMedioCompra)}</td>
      <td>${p.necessitaCompra ? tag('alerta', t('status.comprar')) : ''}</td></tr>`).join('')
    : `<tr><td colspan="8" class="vazio">${t('vazio')}</td></tr>`;
  const sel = $('#sel-produto-estoque'), atual = sel.value;
  sel.innerHTML = todos.map(p => `<option value="${p.id}">${esc(p.sku)} · ${esc(p.nome)}</option>`).join('');
  if (atual) sel.value = atual;
}

$('#form-produto').addEventListener('submit', async ev => {
  ev.preventDefault();
  try {
    const p = await api('POST', '/api/produtos', dadosDoForm(ev.target));
    avisar(t(p.necessitaCompra ? 'ok.produtoCotacao' : 'ok.produto'));
    ev.target.reset();
    recarregar();
  } catch (e) { falhou(e); }
});
$('#form-estoque').addEventListener('submit', async ev => {
  ev.preventDefault();
  const { produtoId, ...corpo } = dadosDoForm(ev.target);
  try {
    const p = await api('PATCH', `/api/produtos/${produtoId}/estoque`, corpo);
    avisar(t(p.necessitaCompra && corpo.tipo !== 'ENTRADA' ? 'ok.movimentoCotacao' : 'ok.movimento'));
    ev.target.quantidade.value = '';
    recarregar();
  } catch (e) { falhou(e); }
});

function blocoRecomendacao(rec, vencedoraId) {
  const itens = rec.ranking.map(i => `<li>${esc(i.fornecedorRazaoSocial)} — ${moeda(i.valorTotal)}
      <span>· ${i.prazoEntregaDias} ${t('det.dias')} · ${num(i.pontuacao, 2)} ${t('det.pts')}${i.propostaId === vencedoraId ? ' · ' + t('det.vencedora') : ''}</span></li>`).join('');
  return `<div class="rec"><h4>${t('crit.' + rec.criterio)}</h4>${itens ? `<ol>${itens}</ol>` : `<span class="sub">${t('det.semRanking')}</span>`}</div>`;
}

  el.hidden = false;

  const propostas = c.propostas.length ? `<table><thead><tr>
      <th>${t('campo.fornecedor')}</th><th class="num">${t('campo.preco')}</th><th class="num">${t('campo.mercadoria')}</th>
      <th class="num">${t('campo.frete')}</th><th class="num">${t('campo.imposto')}</th><th class="num">${t('campo.total')}</th>
      <th class="num">${t('campo.prazo')}</th><th>${t('campo.validade')}</th><th class="num">${t('campo.pontuacao')}</th><th>${t('campo.status')}</th>
    </tr></thead><tbody>${c.propostas.map(p => `<tr>
      <td>${esc(p.fornecedorRazaoSocial)}${p.fornecedorAtivo ? '' : ' ' + tag('off', t('status.inativo'))}</td>
      <td class="num">${moeda(p.precoUnitario)}</td><td class="num">${moeda(p.valorMercadoria)}</td><td class="num">${moeda(p.valorFrete)}</td>
      <td class="num">${moeda(p.valorImpostoCalculado)}</td><td class="num"><b>${moeda(p.valorTotal)}</b></td>
      <td class="num">${p.prazoEntregaDias}</td><td>${data(p.dataValidade)}</td><td class="num">${num(p.pontuacaoCalculada, 2)}</td>
      <td>${tag(p.status)}</td></tr>`).join('')}</tbody></table>` : `<p class="vazio">${t('vazio')}</p>`;

  const convidadosIds = new Set(c.fornecedoresConvidados.map(f => f.id));
  const aberta = c.status === 'ABERTA';
  const podemEnviar = c.abertaAoMercado ? fornecedores : fornecedores.filter(f => convidadosIds.has(f.id));

  const painelAbrir = c.status === 'RASCUNHO' ? `<div class="card"><h3>${t('det.abrir')}</h3><form id="form-abrir">
      <label>${t('campo.convidados')}<div class="checks">${fornecedores.map(f =>
        `<label><input type="checkbox" name="forn" value="${f.id}"> ${esc(f.razaoSocial)}</label>`).join('')}</div>
        <span>${t('det.mercado')}</span></label>
      <label>${t('campo.dataLimite')}<input type="date" name="dataLimite" min="${hojeISO()}" value="${hojeISO(7)}"></label>

  const painelProposta = aberta ? `<div class="card"><h3>${t('det.proposta')}</h3><form id="form-proposta">
      <label>${t('campo.fornecedor')}<select name="fornecedorId" required>${podemEnviar.map(f =>

  const painelDecisao = aberta ? `<div class="card"><h3>${t('det.decisao')}</h3>

      recarregar();
    } catch (e) { falhou(e); }

});

/* ---------------- Inicialização ---------------- */
document.querySelectorAll('[data-aba]').forEach(b => b.addEventListener('click', () => mostrarAba(b.dataset.aba)));
document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => {
  estado.lang = b.dataset.lang;
  localStorage.setItem('lang', estado.lang);
  aplicarIdioma();
  recarregar();
}));
aplicarIdioma();
mostrarAba(Object.keys(carregadores()).includes(estado.aba) ? estado.aba : 'produtos');
</script>
