# Idioma padrão: português (Brasil)
# Mensagens com argumentos passam pelo MessageFormat: aspas simples devem ser escritas como ''

# --- Erros genéricos ---
erro.validacao=Há campos inválidos na requisição
erro.requisicao.invalida=O corpo da requisição está mal formatado ou contém valores inválidos
erro.parametro.invalido=O parâmetro ''{0}'' recebeu um valor inválido: {1}
erro.conflito.integridade=A operação viola uma restrição de unicidade ou integridade dos dados
erro.interno=Ocorreu um erro inesperado. Tente novamente em instantes

# --- Validação de campos (Bean Validation) ---
validacao.obrigatorio=é obrigatório
validacao.tamanho.maximo=deve ter no máximo {max} caracteres
validacao.positivo=deve ser maior que zero
validacao.nao.negativo=não pode ser negativo
validacao.email=deve ser um e-mail válido
validacao.documento=deve ser um CPF (11 dígitos) ou CNPJ (14 dígitos), com ou sem pontuação
validacao.percentual=deve estar entre 0 e 100

# --- Produtos e estoque ---
produto.nao.encontrado=Produto {0,number,#} não encontrado
produto.sku.duplicado=Já existe um produto cadastrado com o SKU ''{0}''
produto.inativo=O produto ''{0}'' está inativo
estoque.saldo.insuficiente=Saldo insuficiente para a saída: saldo atual {0}, quantidade solicitada {1}
estoque.quantidade.positiva=A quantidade deve ser maior que zero para movimentações do tipo {0}
cotacao.observacao.reposicao=Reposição automática: saldo {0} atingiu o estoque mínimo {1} do produto {2}

# --- Fornecedores ---
fornecedor.nao.encontrado=Fornecedor {0,number,#} não encontrado
fornecedor.documento.duplicado=Já existe um fornecedor cadastrado com o documento ''{0}''
fornecedor.inativo=O fornecedor ''{0}'' está inativo

# --- Cotações ---
cotacao.nao.encontrada=Cotação {0,number,#} não encontrada
cotacao.status.inicial.invalido=Uma cotação só pode ser criada como RASCUNHO ou ABERTA (recebido: {0})
cotacao.em.andamento=Já existe a cotação {0} em andamento (status {1}) para este produto
cotacao.status.invalido.abrir=Somente cotações em RASCUNHO podem ser abertas; a cotação {0} está {1}
cotacao.data.limite.passada=A data limite da cotação não pode estar no passado
cotacao.nao.aberta=A cotação {0} não está ABERTA (status atual: {1})
cotacao.prazo.encerrado=O prazo para propostas da cotação {0} encerrou em {1}
cotacao.fornecedor.nao.convidado=O fornecedor ''{0}'' não foi convidado para a cotação {1}

# --- Propostas e decisão ---
proposta.duplicada=O fornecedor ''{0}'' já registrou uma proposta para a cotação {1}
proposta.validade.passada=A data de validade da proposta não pode estar no passado
proposta.minimo.nao.atingido=São necessárias no mínimo {0} propostas válidas para decidir; a cotação {1} possui {2}
proposta.nao.pertence=A proposta {0,number,#} não pertence à cotação {1}
proposta.nao.elegivel.status=A proposta {0,number,#} não está PENDENTE (status atual: {1})
proposta.nao.elegivel.fornecedor.inativo=A proposta {0,number,#} não é elegível: o fornecedor ''{1}'' está inativo
proposta.nao.elegivel.vencida=A proposta {0,number,#} não é elegível: a validade expirou em {1}
proposta.justificativa.obrigatoria=A proposta escolhida ({0,number,#}) difere da recomendada pelo critério {1} (proposta {2,number,#}); informe uma justificativa
proposta.justificativa.automatica=Selecionada automaticamente pelo critério {0}

# --- Pedidos de compra ---
pedido.nao.encontrado=Pedido de compra {0,number,#} não encontrado
pedido.status.invalido.receber=Somente pedidos EMITIDOS podem ser recebidos; o pedido {0} está {1}
